# Frozen evaluation: linear probe + k-NN (probe.py) and RankMe/anisotropy (analyze.py).
#
#   python probe.py   --config configs/frozen_eval.yaml --only dinov3_vitb16_lvd
#   python analyze.py --config configs/frozen_eval.yaml --only dinov3_vitb16_lvd

regime: none          # ignored for probe/analysis (no training, no optimizer)

features:
  remap_v3: false     # embeddings extracted directly in native v3 split order

probe:
  include_finetuned: false
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]

# `models` inherits _DEFAULT_MODELS from src/config.py unless overridden or filtered via --only.
