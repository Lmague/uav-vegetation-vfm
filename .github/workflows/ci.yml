name: ci

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight CPU dependencies (no torch)
        run: python -m pip install --quiet -r requirements-figures.txt
      - name: Syntax-check tracked Python code
        run: python -m compileall -q src scripts research results/baseline_clean_2026-10-08/run_baseline_probe.py probe.py extract.py analyze.py train.py make_figures.py
      - name: Test 11-class split generation
        run: python tests/test_generate_splits_11cls.py
      - name: Test texture descriptors
        run: python tests/test_texture_features.py
      - name: Test core config, metrics, latent, and probe
        run: python tests/test_core.py
      - name: Test reproducibility guards
        run: python tests/test_repo_guards.py
      - name: Verify cold-clone README figure reproduction
        run: python scripts/make_readme_plots.py
